[project]
name = "cortex"
version = "0.1.0"
description = "Memoria compartida para agentes: vault markdown, MCP, skills y rutinas"
requires-python = ">=3.12"
dependencies = [
  "starlette==0.48.0",
  "uvicorn==0.32.1",
  "jinja2==3.1.4",
  "python-multipart==0.0.19",
  "itsdangerous==2.2.0",
  "argon2-cffi==23.1.0",
  "httpx==0.28.1",
  "pyyaml==6.0.2",
  "networkx==3.4.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "mcp==2.1.0"]

[project.scripts]
cortex-env = "cortex.envcli:main"
cortex-init = "cortex.init:main"
cortex-quickstart = "cortex.quickstart:main"
cortex-routine = "cortex.routines.runner:main"
cortex-agentos = "cortex.agentos.server:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--ignore=tests/e2e"
